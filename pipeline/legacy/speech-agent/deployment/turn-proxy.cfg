# TLS terminates here so certificate renewal can drain old connections without
# restarting LiveKit or interrupting active calls. No request/IP access logs.
global
    user haproxy
    group haproxy
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend turn_tls
    bind :443 ssl crt /etc/aljawab-turn/turn.pem
    default_backend livekit_turn

backend livekit_turn
    server embedded 127.0.0.1:5349 send-proxy-v2
