# Merge this section into deployment/livekit.yaml alongside turn-proxy.cfg.
# Use the public IP (or hostname) in the proxy's trusted TLS certificate.
# Preserve the existing keys/rtc. The example IP below must be replaced.
turn:
  enabled: true
  domain: 192.0.2.1
  tls_port: 5349
  external_tls: true
  bind_addresses: [0.0.0.0]
  proxy_protocol: true
  proxy_protocol_trusted_cidrs: [127.0.0.1/32]
