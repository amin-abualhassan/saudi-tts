<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saudi TTS · {{ page|default('login') }}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e2dc;--card:#fff;--acc:#0b6e4f;--bad:#b3261e;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#eceae4;--mut:#9b998f;--line:#2c2c29;--card:#1c1c1a;--acc:#4fbf95;--bad:#f2867d;--warn:#e0b25a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
nav a{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:6px}nav a.on{color:var(--fg);background:var(--card);border:1px solid var(--line)}
nav .sp{flex:1}main{padding:12px 16px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;overflow-x:auto}
h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:0}
.PASS{color:var(--acc);font-weight:600}.FAIL{color:var(--bad);font-weight:600}.RUNNING{color:var(--warn);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.k{color:var(--mut);font-size:12px}.v{font-size:20px;font-weight:600}
input,textarea,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:100%}
button{background:var(--acc);color:#fff;border:0;cursor:pointer}textarea{width:100%}
.chart{width:100%;height:auto}.chart .line{fill:none;stroke:var(--acc);stroke-width:1.5}.chart .ax{fill:var(--mut);font-size:10px}
.err{color:var(--bad)}.mut{color:var(--mut)}
</style>
</head>
<body>
{% if user %}
<nav>
{% for p,l in [('status','Status'),('runs','Runs'),('eval','Eval'),('test','Test'),('questions','Questions'),('logs','Logs')] %}
<a href="{{ '/' if p=='status' else '/'+p }}" class="{{ 'on' if page==p }}">{{ l }}</a>
{% endfor %}<span class="sp"></span><a href="/logout">{{ user }} · logout</a>
</nav>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
